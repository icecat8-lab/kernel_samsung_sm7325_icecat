name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Specify the kernel version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      build_type:
        description: 'Select the compilation mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  compile-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: ${{ github.actor }}
      KBUILD_BUILD_HOST: github-actions
      DEFCONFIG: vendor/a52sxq_icecat_open_defconfig
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Install Essential Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncursesw5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Configure Compilation Cache (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-a52s-${{ github.event.inputs.build_type }}
          max-size: 2G
          variant: ccache

      - name: Download and Configure Toolchains
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchains/proton-clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchains/gcc-64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchains/gcc-32

      - name: Generate Kernel Configuration (.config)
        run: |
          export PATH=$PWD/toolchains/proton-clang/bin:$PWD/toolchains/gcc-64/bin:$PWD/toolchains/gcc-32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="ccache clang"
          
          # Note: LOCALVERSION is intentionally omitted here to respect the defconfig value (-icecat-qgki)
          make O=out $DEFCONFIG

      - name: Execute Kernel Compilation Process
        run: |
          export PATH=$PWD/toolchains/proton-clang/bin:$PWD/toolchains/gcc-64/bin:$PWD/toolchains/gcc-32/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="ccache clang"
          
          make -j$(nproc --all) O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            Image dtbs modules

      - name: Install and Aggregate Kernel Modules
        run: |
          mkdir -p modules_out modules_flat
          make O=out INSTALL_MOD_PATH=$PWD/modules_out modules_install
          find modules_out -name "*.ko" -exec cp {} modules_flat/ \;

      - name: Package Boot Image via AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          
          # Configure AnyKernel3 for A52s (A-only device)
          sed -i 's/module=.*;/module=1;/' anykernel.sh
          sed -i 's/block=.*;/block=auto;/' anykernel.sh
          sed -i 's/device.name.*/device.name.1=a52sxq;/' anykernel.sh
          
          # Copy Kernel Image
          cp ../out/arch/arm64/boot/Image .
          
          # Copy Device Tree Blobs (if available)
          mkdir -p dtb
          cp ../out/arch/arm64/boot/dts/qcom/*.dtb dtb/ 2>/dev/null || true
          
          # Copy Kernel Modules (.ko)
          mkdir -p modules
          cp ../modules_flat/*.ko modules/ 2>/dev/null || echo "No modules found"
          
          # Create Flashable ZIP
          zip -r9 "../Icecat-Kernel-${{ github.event.inputs.kernel_version }}.zip" * -x .git README.md *placeholder
          cd ..

      - name: Upload Compilation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Icecat-Kernel-Artifacts
          path: |
            out/arch/arm64/boot/Image
            modules_flat/*.ko
            Icecat-Kernel-*.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event.inputs.build_type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.kernel_version }}
          name: Icecat Kernel ${{ github.event.inputs.kernel_version }}
          files: Icecat-Kernel-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
